; Настройки PHP боевого сервера поверх php.ini-production.
memory_limit = 256M
; Фото и видео объектов загружаются из админки (видео — до 100 МБ).
upload_max_filesize = 100M
post_max_size = 128M
max_file_uploads = 30
expose_php = Off
date.timezone = Europe/Moscow

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; Код в образе не меняется до следующей сборки — проверять файлы незачем.
opcache.validate_timestamps = 0
